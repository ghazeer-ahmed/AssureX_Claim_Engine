{% extends "base.html" %}

{% block title %}
Login | AssureX Claim Engine
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <div class="mb-4">

                <span class="small-title">
                    Account Access
                </span>

                <h2 class="mt-3">
                    Login
                </h2>

                <p class="text-secondary">
                    Enter your registered email and password.
                </p>

            </div>


            <form method="POST">
                <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ request.form.get('email', '') }}"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Login
                </button>

            </form>


            <p class="text-center mt-4 mb-0">

                Need an account?

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
