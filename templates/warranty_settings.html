{% extends "base.html" %}

{% block title %}
Warranty Settings | AssureX Claim Engine
{% endblock %}

{% block content %}

<section class="warranty-section">

    <div class="container">

        <div class="settings-card">

            <span class="small-title">
                Administrator
            </span>

            <h1 class="mt-3">
                Warranty Alert Settings
            </h1>

            <p class="text-secondary">
                Set how many days before warranty expiry
                an alert should appear.
            </p>


            <form method="POST" class="mt-4">
                <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

                <div class="mb-4">

                    <label class="form-label">
                        Days Before Expiry
                    </label>

                    <input
                        type="number"
                        name="warranty_alert_days"
                        class="form-control"
                        min="1"
                        value="{{ alert_days }}"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Setting
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
