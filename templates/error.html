{% extends 'base.html' %}{% block title %}Request {{ code }} | AssureX{% endblock %}{% block content %}<section
    class="workspace container">
    <div class="empty-card"><span class="small-title">{{ code }}</span>
        <h1 class="mt-3">We couldn't complete that request</h1>
        <p>{{ message }}</p><a
            href="{{ url_for('workflow.dashboard') if session.get('user_id') else url_for('login') }}"
            class="btn btn-primary">Return to workspace</a>
    </div>
</section>{% endblock %}
