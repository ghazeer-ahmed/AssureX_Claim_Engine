const expected={'valid_claim':'Valid Claim','invalid_claim':'Invalid Claim','manual_review':'Manual Review'};
const status=document.getElementById('status'), bar=document.getElementById('progress'), preview=document.getElementById('preview');
document.getElementById('run').addEventListener('click', async () => {
 const button=document.getElementById('run'); button.disabled=true;
 try {
  status.textContent='Loading Teachable Machine model...';
  const model=await tmImage.load('/models/model.json','/models/metadata.json');
  const output=[];
  for (let i=0;i<rows.length;i++) {
   const item=rows[i];
   preview.src='/cards/'+item.path;
   await new Promise((resolve,reject)=>{preview.onload=resolve;preview.onerror=reject;});
   const predictions=await model.predict(preview);
   const scores={};
   for (const p of predictions) {
    const label=expected[p.className];
    if (label) scores[label]=p.probability;
   }
   if (Object.keys(scores).length!==3) throw new Error('Unexpected model labels: '+JSON.stringify(predictions));
   output.push({claim_id:item.claim_id,actual_class:item.label,predicted_class:Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b),...scores});
   bar.value=i+1;
   status.textContent=`Evaluated ${i+1} of ${rows.length} cards`;
   if ((i+1)%10===0) await new Promise(resolve=>setTimeout(resolve,0));
  }
  const response=await fetch('/__save_tm_predictions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'holdout_test',model_name:'Teachable Machine image classifier',rows:output})});
  if (!response.ok) throw new Error(await response.text());
  status.textContent='Complete. All 225 predictions were saved to the project evaluation report.';
 } catch (e) {status.textContent='Evaluation stopped: '+(e?.stack||e);button.disabled=false;}
});
setTimeout(()=>document.getElementById('run').click(),1000);
